      CONNECTOR_GRANT: 'account:166786020837:ConductorOneIntegrationAWSConnectorTest:user:00u9v0dr25mnwWRbK5d7'
      CONNECTOR_ENTITLEMENT: 'account:166786020837:ConductorOneIntegrationAWSConnectorTest'
